[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dinkster-inference"
version = "0.1.2"
description = "Dinkster-owned inference library forked from ComfyUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchsde",
  "torchvision",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.50.3",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "PyYAML",
  "Pillow>=10.1.0",
  "scipy",
  "tqdm",
  "psutil",
  "comfy-kitchen==0.2.42",
  "comfy-aimdo==0.6.0",
  "trimesh",
]

[project.urls]
repository = "https://github.com/Kosinkadink/dinkster-inference"

[tool.setuptools]
py-modules = ["node_helpers"]

[tool.setuptools.packages.find]
include = ["dinkster_inference*", "comfy"]

[tool.setuptools.package-data]
dinkster_inference = ["**/*.json", "**/*.model", "**/*.txt"]

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]
