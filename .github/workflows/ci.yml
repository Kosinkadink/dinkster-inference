name: CI

on:
  push:
    branches: [main, 'release/upstream-v*']
  pull_request:

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check classified library files
        run: python tools/check_library_files.py
      - name: Check library dependency declarations
        run: python tools/check_dependencies.py
      - name: Check upstream files against the recorded upstream commit
        run: |
          set -euo pipefail
          recorded=$(grep -oE '[0-9a-f]{40}' docs/ledger.md | head -n 1)
          git init --quiet "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch --quiet --depth 1 https://github.com/Comfy-Org/ComfyUI.git "$recorded"
          git -C "$RUNNER_TEMP/upstream" checkout --quiet FETCH_HEAD
          python tools/check_upstream_parity.py --differences --declared tools/fork_differences.txt --upstream "$RUNNER_TEMP/upstream"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install wheel and test dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip install -r tests-unit/requirements.txt
          python -m pip install ruff
      - name: Verify standalone imports
        # Outside the checkout, so the import comes from the installed wheel.
        working-directory: ${{ runner.temp }}
        run: |
          if ! python -c "import dinkster_inference.cli_args as c; c.args.cpu = True; import dinkster_inference.sd, dinkster_inference.samplers, dinkster_inference.model_management" 2>import-error.log; then
            message=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' import-error.log)
            echo "::error title=Standalone import failed::$message"
            exit 1
          fi
      - name: Check inference and packaging lint
        run: python -m ruff check dinkster_inference comfy node_helpers.py tools
      - name: Run retained library tests
        run: python -m pytest -q tests-unit/comfy_test tests-unit/comfy_quant tests-unit/workflow_comparison_test.py tests-unit/release_test.py tests-unit/dependencies_test.py tests-unit/library_files_test.py
