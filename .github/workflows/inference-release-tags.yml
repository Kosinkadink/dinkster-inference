name: Inference release tags

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'release/upstream-v*']
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: inference-release-tags
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: github.repository == 'Kosinkadink/dinkster-inference' && (github.event_name == 'schedule' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source and acquire upstream tag history
        id: source
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          SOURCE=$(git rev-parse HEAD)
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SOURCE&status=success")
          if [ "$(jq --arg source "$SOURCE" '[.workflow_runs[] | select(.head_sha == $source and .event == "push")] | length' <<< "$runs")" -eq 0 ]; then
            # CI for this commit is still running or failed; its completion event runs this job again.
            echo "Skip main commit without a successful CI run yet: $SOURCE"
            exit 0
          fi
          git remote add upstream https://github.com/Comfy-Org/ComfyUI.git
          git fetch --no-tags upstream master '+refs/tags/*:refs/upstream-tags/*'
          git fetch --no-tags origin '+refs/heads/release/upstream-v*:refs/remotes/origin/release/upstream-v*'
          identity=$(gh api user)
          name=$(jq -r .login <<< "$identity")
          email="$(jq -r .id <<< "$identity")+$name@users.noreply.github.com"
          {
            echo "GIT_AUTHOR_NAME=$name"
            echo "GIT_AUTHOR_EMAIL=$email"
            echo "GIT_COMMITTER_NAME=$name"
            echo "GIT_COMMITTER_EMAIL=$email"
          } >> "$GITHUB_ENV"
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Create immutable source tags
        id: tags
        if: steps.source.outputs.current == 'true'
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '[]' > "$RUNNER_TEMP/inference-main-release.json"
          python tools/inference_release.py plan --source "$SOURCE" > /tmp/inference-releases.json
          while IFS= read -r release; do
            version=$(jq -r .version <<< "$release")
            commit=$(jq -r .sourceCommit <<< "$release")
            branch=$(jq -r '.branch // empty' <<< "$release")
            if [ -n "$branch" ]; then
              if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
                git push origin "$commit:refs/heads/$branch"
              fi
            fi
            runs=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success")
            if [ "$(jq --arg commit "$commit" --arg branch "${branch:-main}" \
              '[.workflow_runs[] | select(.head_sha == $commit and .head_branch == $branch and .event == "push")] | length' <<< "$runs")" -eq 0 ]; then
              echo "Wait for exact-source CI: $commit"
              continue
            fi
            jq -n --arg tag "v$version" --arg message "$release" --arg object "$commit" \
              '{tag: $tag, message: $message, object: $object, type: "commit"}' > /tmp/inference-tag.json
            if [ "$(jq -r '.releaseSource // empty' <<< "$release")" = synced-main ]; then
              # Suppress the historical tag's old workflow; current release.yml consumes this manifest.
              object=$(GH_TOKEN="$REPOSITORY_TOKEN" gh api --method POST "repos/$REPOSITORY/git/tags" --input /tmp/inference-tag.json --jq .sha)
              GH_TOKEN="$REPOSITORY_TOKEN" gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$object"
              jq -s '.' <<< "$release" > "$RUNNER_TEMP/inference-main-release.json"
              echo "historical=true" >> "$GITHUB_OUTPUT"
            else
              object=$(gh api --method POST "repos/$REPOSITORY/git/tags" --input /tmp/inference-tag.json --jq .sha)
              gh api --method POST "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$object"
            fi
          done < <(jq -c '.[]' /tmp/inference-releases.json)
      - uses: actions/upload-artifact@v4
        if: steps.tags.outputs.historical == 'true'
        with:
          name: stable-main-release
          path: ${{ runner.temp }}/inference-main-release.json
          if-no-files-found: error
